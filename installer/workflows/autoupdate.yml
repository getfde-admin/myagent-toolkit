name: 🤖 Agent Core Update

on:
  schedule:
    - cron: "0 0 * * *" # Daily UTC 00:00 (UTC+8 08:00)
  workflow_dispatch:
    inputs:
      force:
        description: "Force the update (ignore version comparison)"
        type: boolean
        default: false
      sync_command:
        description: "Sync Telegram quick commands after the update"
        type: boolean
        default: false
      request_id:
        description: "Telegram workflow notification request id"
        type: string
        default: ""

run-name: >-
  🤖 Agent Core Update: ${{ github.repository }}${{ github.event_name == 'workflow_dispatch' && inputs.request_id != '' && format(' | req:{0}', inputs.request_id) || '' }}

concurrency:
  group: auto-update-${{ github.repository }}
  cancel-in-progress: false

env:
  PACKAGE_MANIFEST_URL: https://getfde-admin.github.io/myagent-core/github-agent-worker-package.json

permissions:
  contents: write

jobs:
  check-version:
    name: Version Check
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      should_update: ${{ steps.compare.outputs.should_update }}
      remote_version: ${{ steps.compare.outputs.remote_version }}
      remote_revision: ${{ steps.compare.outputs.remote_revision }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Read remote package manifest
        id: compare
        env:
          STORED_VERSION: ${{ vars.AGENT_PACKAGE_VERSION }}
          STORED_REVISION: ${{ vars.AGENT_PACKAGE_REVISION }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          echo "🔍 Reading remote package manifest..."
          RESPONSE="$(curl -fsSL "$PACKAGE_MANIFEST_URL")"

          REMOTE_VERSION="$(echo "$RESPONSE" | jq -r '.version // empty')"
          REMOTE_REVISION="$(echo "$RESPONSE" | jq -r '.revision // empty')"
          echo "remote_version=$REMOTE_VERSION" >> "$GITHUB_OUTPUT"
          echo "remote_revision=$REMOTE_REVISION" >> "$GITHUB_OUTPUT"
          echo "🏷️ Remote version: ${REMOTE_VERSION:-not provided}"
          echo "🔖 Remote revision: ${REMOTE_REVISION:-not provided}"
          echo "📌 Stored version: ${STORED_VERSION:-not set}"
          echo "📌 Stored revision: ${STORED_REVISION:-not set}"

          if [[ "${FORCE:-false}" == "true" ]]; then
            echo "⚡ Force mode, skipping version comparison"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$REMOTE_VERSION" && -z "$REMOTE_REVISION" ]]; then
            echo "::error::manifest is missing version and revision, cannot compare"
            exit 1
          elif [[ -n "$REMOTE_REVISION" ]]; then
            if [[ "$REMOTE_REVISION" == "${STORED_REVISION:-}" ]]; then
              echo "✅ Revision unchanged ($REMOTE_REVISION), skipping this update"
              echo "should_update=false" >> "$GITHUB_OUTPUT"
            elif [[ -z "${STORED_REVISION:-}" ]]; then
              echo "📋 No stored revision, performing first package sync"
              echo "should_update=true" >> "$GITHUB_OUTPUT"
            else
              echo "🚀 Revision changed (${STORED_REVISION:-not set} -> $REMOTE_REVISION), preparing to trigger deploy"
              echo "should_update=true" >> "$GITHUB_OUTPUT"
            fi
          elif [[ -n "$REMOTE_VERSION" && "$REMOTE_VERSION" == "${STORED_VERSION:-}" ]]; then
            echo "✅ Version unchanged ($REMOTE_VERSION), skipping this update"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "${STORED_VERSION:-}" && -z "${STORED_REVISION:-}" ]]; then
            echo "📋 No deployed package info stored, performing first sync"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "🚀 Package change detected, preparing to trigger deploy"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip summary
        if: steps.compare.outputs.should_update == 'false'
        env:
          REMOTE_VERSION: ${{ steps.compare.outputs.remote_version }}
          REMOTE_REVISION: ${{ steps.compare.outputs.remote_revision }}
          STORED_VERSION: ${{ vars.AGENT_PACKAGE_VERSION }}
          STORED_REVISION: ${{ vars.AGENT_PACKAGE_REVISION }}
        run: |
          echo "### 🤖 Auto Update Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version unchanged, skipping this update.**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Repository | \`${GITHUB_REPOSITORY}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Current version | \`${REMOTE_VERSION:-not provided}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Current revision | \`${REMOTE_REVISION:-not provided}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stored version | \`${STORED_VERSION:-not set}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stored revision | \`${STORED_REVISION:-not set}\` |" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Trigger deploy
    needs: check-version
    if: needs.check-version.outputs.should_update == 'true'
    uses: ./.github/workflows/deploy-myagent.yml
    secrets: inherit

  update-state:
    name: Update deployed version metadata
    needs:
      - check-version
      - deploy
    if: always() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    env:
      GH_TOKEN: ${{ secrets.AGENT_SYS_GITHUB_TOKEN }}
      REMOTE_VERSION: ${{ needs.check-version.outputs.remote_version }}
      REMOTE_REVISION: ${{ needs.check-version.outputs.remote_revision }}
    steps:
      - name: Persist package metadata
        run: |
          set -euo pipefail

          if [[ -n "${REMOTE_VERSION:-}" ]]; then
            gh variable set AGENT_PACKAGE_VERSION \
              --body "$REMOTE_VERSION" \
              --repo "$GITHUB_REPOSITORY"
            echo "✅ Updated AGENT_PACKAGE_VERSION -> $REMOTE_VERSION"
          fi

          if [[ -n "${REMOTE_REVISION:-}" ]]; then
            gh variable set AGENT_PACKAGE_REVISION \
              --body "$REMOTE_REVISION" \
              --repo "$GITHUB_REPOSITORY"
            echo "✅ Updated AGENT_PACKAGE_REVISION -> $REMOTE_REVISION"
          fi

  sync-templates:
    name: Sync upstream templates & models
    runs-on: ubuntu-latest
    needs: check-version
    if: always()
    steps:
      - name: Checkout instance repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.AGENT_SYS_GITHUB_TOKEN || github.token }}

      - name: Checkout upstream templates & models
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.TEMPLATES_SOURCE_REPO || 'getfde-admin/myagent-toolkit' }}
          ref: main
          path: upstream-toolkit
          sparse-checkout: |
            installer/templates/

      - name: Sync upstream templates & models.json to main branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "upstream-toolkit/installer/templates" && -d "templates" ]]; then
            echo "🔄 Syncing updated template models and specs from upstream..."
            for dir in templates/*; do
              if [[ -d "$dir" ]]; then
                tpl_name="$(basename "$dir")"
                src="upstream-toolkit/installer/templates/$tpl_name"
                if [[ -d "$src" ]]; then
                  echo "Updating template: $tpl_name"
                  rsync -a "$src/" "$dir/"
                fi
              fi
            done

            git config user.name "${{ vars.AUTOMATION_GIT_USER_NAME || 'github-actions[bot]' }}"
            git config user.email "${{ vars.AUTOMATION_GIT_USER_EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"
            git remote set-url origin "https://x-access-token:${{ secrets.AGENT_SYS_GITHUB_TOKEN || github.token }}@github.com/${{ github.repository }}.git"

            git add templates/
            if ! git diff --cached --quiet; then
              git commit -m "chore(templates): auto-sync latest models and templates from upstream"
              # Push with rebase retry: if the remote moved (non-fast-forward),
              # pull --rebase and push again instead of failing the whole job.
              for attempt in 1 2 3; do
                if git push origin HEAD:main; then
                  echo "✅ Template models and configurations synced successfully"
                  break
                fi
                echo "⚠️ Push rejected (attempt $attempt/3), rebasing on remote main..."
                git fetch origin main
                git rebase origin/main
              done
              if ! git diff --quiet origin/main HEAD; then
                echo "::error::Failed to push template sync after 3 attempts (remote keeps moving)."
                exit 1
              fi
            else
              echo "ℹ️ Templates already up to date with upstream"
            fi
          fi

      - name: Summary
        run: |
          echo "### 🤖 Auto Update Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Template & model synchronization completed.**" >> "$GITHUB_STEP_SUMMARY"
